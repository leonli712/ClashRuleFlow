proxy-groups:
  - name: 🚀 手动选择
    type: select
    proxies:
      - DIRECT
      - 🚀 所有-自动
      - 🌍 港台日新韩-自动
      - 🌏 台日新韩-自动
      - 🇭🇰 香港-自动
      - 🇹🇼 台湾-自动
      - 🇯🇵 日本-自动
      - 🇸🇬 新加坡-自动
      - 🇰🇷 韩国-自动
      - 🇺🇸 美国-自动
      - 🌐 其他-自动
      - 🔒 Kuromis
      - 🔑 TAG
      - ⚡ BoostNet
      - 🐦 FlyingBird

  - name: 🚀 所有-自动
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 180
    tolerance: 5
    timeout: 100
    proxies: []

  - name: 🌍 港台日新韩-自动
