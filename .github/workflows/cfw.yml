name: 生成CFW配置

on:
  push:
    paths:
      - 'PC.ini'
      - 'tools/generate_cfw.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cfw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: pip install pyyaml
      - name: 生成配置
        env:
          INSIDE_SERVER: ${{ secrets.INSIDE_SERVER }}
          INSIDE_PORT: ${{ secrets.INSIDE_PORT }}
          OUTSIDE_SERVER: ${{ secrets.OUTSIDE_SERVER }}
          OUTSIDE_PORT: ${{ secrets.OUTSIDE_PORT }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: python3 tools/generate_cfw.py PC.ini Inside.yml Outside.yml
      - name: 上传为私密Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfw-configs
          path: |
            Inside.yml
            Outside.yml
          retention-days: 90
